[project]
name = "taskcoord"
version = "0.1.0"
description = "LAN task coordination service. Task state lives here, not in Git."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyMySQL>=1.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
taskctl = "taskcoord.cli.taskctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskcoord = ["web/*", "web/vendor/*", "web/vendor/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

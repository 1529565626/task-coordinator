<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Coordinator · 任务协调</title>
  <link rel="stylesheet" href="/assets/app.css?v=4">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true">TC</span>
        <div>
          <p class="eyebrow">TASK COORDINATOR · LAN SERVICE</p>
          <h1>任务协调服务</h1>
        </div>
      </div>
      <div class="top-actions">
        <span id="service-status" class="status-pill">正在连接</span>
        <span id="auth-status" class="status-pill neutral">未登录</span>
        <form id="login-form" class="login-inline">
          <input name="username" autocomplete="username" placeholder="管理员" required>
          <input name="password" type="password" autocomplete="current-password" placeholder="密码" required>
          <button class="button primary" type="submit">登录</button>
        </form>
        <button type="button" id="logout-button" class="button secondary" hidden>退出</button>
        <button type="button" id="refresh-button" class="button secondary">刷新</button>
      </div>
    </header>

    <aside class="library-panel" aria-label="任务列表">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">PROJECT TASKS</p>
          <h2>任务库</h2>
        </div>
        <button id="toggle-create" class="icon-button" type="button" aria-label="新建" title="新建项目 / 任务">＋</button>
      </div>

      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="filter-query" type="search" placeholder="搜索编号、标题、负责人">
      </label>

      <div class="filter-row">
        <label>
          <span class="scope-label">项目</span>
          <select id="filter-project" aria-label="项目筛选"></select>
        </label>
        <label>
          <span class="scope-label">负责人</span>
          <input id="filter-owner" placeholder="owner">
        </label>
        <label>
          <span class="scope-label">Scope</span>
          <input id="filter-scope" placeholder="scope">
        </label>
      </div>

      <div class="filter-chips" id="status-chips" role="group" aria-label="状态筛选"></div>
      <div id="task-summary" class="task-summary"></div>
      <div id="task-list" class="record-list" aria-live="polite"></div>
    </aside>

    <main class="editor-panel">
      <section class="record-header">
        <div>
          <p id="detail-eyebrow" class="eyebrow">SELECT A TASK</p>
          <h2 id="detail-title">选择一条任务查看详情</h2>
          <p id="detail-meta" class="record-id">—</p>
        </div>
        <div id="detail-actions" class="record-actions"></div>
      </section>

      <div id="detail" class="form-container empty-state">
        <div class="empty-card">
          <span class="empty-symbol">◇</span>
          <h3>尚未选择任务</h3>
          <p>从左侧选择任务后，这里显示描述、scope、租约、交付记录、审计与管理操作。</p>
        </div>
      </div>

      <section id="create-panel" class="create-panel" hidden>
        <div class="create-grid">
          <form id="create-project-form" class="create-card">
            <p class="eyebrow">NEW PROJECT</p>
            <h3>新建项目</h3>
            <label>Key<input name="key" placeholder="map-build" required></label>
            <label>名称<input name="name" placeholder="项目名称" required></label>
            <button class="button primary" type="submit">创建项目</button>
          </form>
          <form id="create-task-form" class="create-card">
            <p class="eyebrow">NEW TASK</p>
            <h3>新建任务</h3>
            <label>编号<input name="id" placeholder="TS-000" required></label>
            <label>项目 Key<input name="project_key" placeholder="project_0001" required></label>
            <label>标题<input name="title" placeholder="标题" required></label>
            <label>优先级<input name="priority" type="number" value="100"></label>
            <label>Scope<textarea name="scopes" placeholder="每行一个 scope" required></textarea></label>
            <label>描述<textarea name="description" placeholder="描述与验收要求"></textarea></label>
            <button class="button primary" type="submit">创建为待确认</button>
          </form>
        </div>
      </section>
    </main>

    <aside class="side-panel" aria-label="Agent 与看板">
      <div class="panel-heading preview-heading">
        <div>
          <p class="eyebrow">AGENTS & BOARD</p>
          <h2>运行概览</h2>
        </div>
      </div>
      <div id="board" class="mini-board"></div>
      <div class="panel-heading preview-heading" style="padding-top:18px">
        <div>
          <p class="eyebrow">ACTIVE AGENTS</p>
          <h2>Agent</h2>
        </div>
      </div>
      <div id="agents" class="agent-list"></div>
    </aside>
  </div>

  <dialog id="danger-dialog">
    <form method="dialog" id="danger-form">
      <p class="eyebrow">CONFIRM ACTION</p>
      <h2 id="danger-title"></h2>
      <p id="danger-copy" class="muted"></p>
      <label>原因<textarea id="danger-reason" required></textarea></label>
      <label id="danger-extra-label" hidden>补充<input id="danger-extra"></label>
      <menu>
        <button class="button secondary" value="cancel" type="submit">取消</button>
        <button class="button danger" value="confirm" id="danger-confirm" type="submit">确认</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/assets/app.js?v=4"></script>
</body>
</html>
